name: Simulateur iOS

# Ouvre l'app dans Safari sur de vrais simulateurs iOS (Xcode, sur les Mac de GitHub, gratuits pour un
# dépôt public) et parcourt les écrans de scripts/ios.mjs, piloté par safaridriver (le WebDriver
# d'Apple) : premier lancement, accueil, un jeu de chaque rubrique, jeux du CM, explication d'une
# erreur, réglages des parents, fiche d'un enfant, puis « Vérifier l'affichage » de l'app (chaque niveau
# de chaque jeu, toutes les classes) ; l'iPad aussi en paysage. Les captures et le rapport (index.html,
# rapport.md) sont dans les artefacts « ios-… » ; le résumé s'affiche sur la page de l'exécution.
# Se lance à la main (onglet Actions → Simulateur iOS → Run workflow) et quand ce test change.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**', 'claude_mdu/**']
    paths: ['scripts/ios.mjs', '.github/workflows/ios.yml']

permissions:
  contents: read

jobs:
  ios:
    name: ${{ matrix.nom }}
    runs-on: ${{ matrix.mac }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: iPhone SE, iOS 18.5
            mac: macos-15
            appareil: iPhone SE (3rd generation)
            version: '18.5'
            xcode: '16.4'
            dossier: iphone-se
          - nom: iPhone 17, iOS 26.2
            mac: macos-15
            appareil: iPhone 17
            version: '26.2'
            xcode: '26.2'
            dossier: iphone-17
          - nom: iPad mini, iOS 26.2
            mac: macos-15
            appareil: iPad mini (A17 Pro)
            version: '26.2'
            xcode: '26.2'
            paysage: '1'
            dossier: ipad-mini
          # iOS 27 : pas encore. Sur l'image « xcode-27 » de GitHub (macOS 27, Xcode 27.0, octobre 2026),
          # les simulateurs iOS 27 démarrent (Device Hub ouvert), mais safaridriver (Safari 27.0.1) refuse
          # toute session : « Could not find any session hosts that match the requested capabilities »
          # (PR #39). À réessayer avec mac: xcode-27, version: '27', xcode: '27.0', et par exemple
          # appareil: iPhone 17|iPhone 18 ou iPad mini (A17 Pro)|iPad mini*.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      # une fois par Mac : autoriser safaridriver à piloter Safari (et les simulateurs)
      - run: sudo safaridriver --enable
      - run: node scripts/ios.mjs
        env:
          IOS_APPAREIL: ${{ matrix.appareil }}
          IOS_VERSION: ${{ matrix.version }}
          IOS_PAYSAGE: ${{ matrix.paysage }}
          SORTIE: ios-sortie/${{ matrix.dossier }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-${{ matrix.dossier }}
          path: ios-sortie
